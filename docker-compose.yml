
 services:
   postgres:
     image: postgres:16-alpine
     container_name: codeflow-postgres
     environment:
       POSTGRES_DB: codeflow
       POSTGRES_USER: codeflow
       POSTGRES_PASSWORD: codeflow
     ports:
       - "5432:5432"
     volumes:
       - codeflow_pgdata:/var/lib/postgresql/data
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U codeflow -d codeflow"]
       interval: 5s
       timeout: 5s
       retries: 5

   api:
     build:
       context: ./backend
       dockerfile: CodeFlow.Api/Dockerfile
     container_name: codeflow-api
     environment:
       ASPNETCORE_ENVIRONMENT: Development
       ConnectionStrings__DefaultConnection: "Host=postgres;Database=codeflow;Username=codeflow;Password=codeflow;Include Error Detail=true"
       Jwt__Key: "CodeFlow-Docker-SecretKey-Min32Chars!!"
       Jwt__Issuer: "CodeFlow.Api"
     ports:
       - "5001:8080"
     depends_on:
       postgres:
         condition: service_healthy

 volumes:
   codeflow_pgdata:
